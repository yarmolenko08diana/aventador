[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malscan-backend"
version = "0.0.1"
description = "API (FastAPI) и worker анализа"
requires-python = ">=3.11"
dependencies = [
    "malcore",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
# шрифт DejaVu для кириллицы в PDF
"app" = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]
