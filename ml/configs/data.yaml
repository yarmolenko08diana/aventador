# Параметры подготовки данных BODMAS (этап 1, раздел 7 ТЗ)

# Доли выборок при разбиении по времени: ранние -> train, средние -> val, поздние -> test
ratios:
  train: 0.70
  val: 0.10
  test: 0.20

# Задача family: семейство попадает в классификатор, только если у него достаточно
# образцов и в обучении, и в тесте. Остальные семейства используются для оценки
# ответа «семейство не определено» (open-set) и в обучение не идут.
family:
  min_train: 100
  min_val: 10
  min_test: 20

# Задача category: категории с малым числом образцов в train объединяются в "other"
category:
  min_train: 100

seed: 42
