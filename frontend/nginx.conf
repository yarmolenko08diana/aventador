server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Чуть больше лимита API (50 МБ), чтобы ответ об ошибке размера пришёл от API, а не от nginx
    client_max_body_size 55m;

    # API и его документация (Swagger) — в контейнере api
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # Одностраничное приложение: любые адреса (/history, /analyses/5) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
