[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malcore"
version = "0.0.1"
description = "Общий пакет: извлечение признаков, индикаторы, инференс (используется и в ml, и в backend)"
requires-python = ">=3.11"
# Версия LIEF зафиксирована: от неё зависят значения признаков EMBER v2.
# Совместимость с оригинальным ember проверяет core/tests/test_vector_reference.py.
dependencies = [
    "numpy>=1.26",
    "pefile>=2023.2.7",
    "lief==1.0.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "lightgbm>=4.3",
    # torch ставится из CPU-индекса PyTorch (make install), иначе pip скачает сборку с CUDA на ~2 ГБ
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
