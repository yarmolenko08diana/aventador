[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malcore"
version = "0.0.1"
description = "Общий пакет: извлечение признаков, индикаторы, инференс (используется и в ml, и в backend)"
requires-python = ">=3.11"
# Зависимости добавляются по этапам. На этапе 2 здесь будут зафиксированы
# точные версии lief и экстрактора ember (раздел 2 ТЗ, риск согласованности).
dependencies = [
    "numpy>=1.26",
    "pefile>=2023.2.7",
]

[tool.setuptools.packages.find]
where = ["src"]
